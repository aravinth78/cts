<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            font-size: 1.2em;
        }
        .navBar{
            display: flex;
            justify-content: space-around;
            background-color: #34495e;
            padding: 12px;
        }
        .navBar a{
            color: white;
            text-decoration: none;
        }
        img{
            max-width: 100%;
            height: auto;
            display: block;
            margin: 20px auto;
        }
        @media screen and (max-width:600px){
            .navBar{
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            body{
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
<div class="navBar">
    <a href="#">Home</a>
    <a href="#">Shop</a>
    <a href="#">About</a>
</div>
<img src="event.jpg" alt="Event banner">
</body>
</html>
