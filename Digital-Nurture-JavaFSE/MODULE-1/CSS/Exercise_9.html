<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transitions and Animations</title>
    <style>
        .box{
            width: 120px;
            height: 120px;
            background-color: #e67e22;
            margin: 30px auto;
            transition: transform 0.5s, background-color 0.5s;
        }
        .box:hover{
            transform: rotate(45deg) scale(1.2);
            background-color: #1abc9c;
        }
        @keyframes slideIn{
            from{
                margin-left: 0;
                opacity: 0;
            }
            to{
                margin-left: 50px;
                opacity: 1;
            }
        }
        .animated{
            width: 120px;
            height: 40px;
            background-color: #9b59b6;
            color: white;
            text-align: center;
            line-height: 40px;
            animation: slideIn 2s infinite alternate;
        }
    </style>
</head>
<body>
<h1 style="text-align:center;">Hover Effects</h1>
<div class="box"></div>
<div class="animated">Slide</div>
</body>
</html>
