<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning</title>
    <style>
        .banner{
            border: 2px solid #333;
            padding: 15px;
            margin: 20px;
            width: 300px;
        }
        input:focus{
            outline: 3px solid #9b59b6;
        }
        .conceal{
            visibility: hidden;
        }
        .erase{
            display: none;
        }
    </style>
</head>
<body>
<div class="banner">
    <h2>Flash Sale</h2>
    <p>Up to 50% off on selected items today.</p>
</div>
<input type="text" placeholder="Search">
<p class="conceal">Concealed using visibility.</p>
<p class="erase">Erased using display none.</p>
</body>
</html>
