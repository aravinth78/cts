<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout</title>
    <style>
        .gridContainer{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            width: 90%;
            margin: auto;
        }
        .gridItem{
            background-color: #3498db;
            color: white;
            padding: 25px;
            text-align: center;
            border-radius: 6px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
<h2 style="text-align:center;">Gallery Grid</h2>
<div class="gridContainer">
    <div class="gridItem">Photo 1</div>
    <div class="gridItem">Photo 2</div>
    <div class="gridItem">Photo 3</div>
    <div class="gridItem">Photo 4</div>
    <div class="gridItem">Photo 5</div>
    <div class="gridItem">Photo 6</div>
</div>
</body>
</html>
