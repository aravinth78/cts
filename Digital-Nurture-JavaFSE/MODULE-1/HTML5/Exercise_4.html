<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Timetable</title>
    <style>
        .schedule {
            border: 1px solid #333;
            padding: 4px;
        }
        td, th {
            padding: 8px 12px;
        }
    </style>
</head>
<body>
<center>
<h2>Weekly Lecture Timetable</h2>
<table border="1">
<thead>
<tr>
    <th>Day</th>
    <th>9 AM</th>
    <th>11 AM</th>
    <th>2 PM</th>
</tr>
</thead>
<tbody>
<tr>
    <td>Monday</td>
    <td class="schedule">Math</td>
    <td class="schedule">Physics</td>
    <td class="schedule">Lab</td>
</tr>
<tr>
    <td>Wednesday</td>
    <td class="schedule">Chemistry</td>
    <td class="schedule">Computer Science</td>
    <td class="schedule">Tutorial</td>
</tr>
<tr>
    <td>Friday</td>
    <td class="schedule">English</td>
    <td class="schedule">Elective</td>
    <td class="schedule">Sports</td>
</tr>
</tbody>
</table>
</center>
</body>
</html>
