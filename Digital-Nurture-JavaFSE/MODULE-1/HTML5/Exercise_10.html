<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas and SVG</title>
</head>
<body>
<center>
<h2>Canvas Drawing</h2>
<canvas id="artboard" width="400" height="200" style="border:1px solid black;"></canvas>
<script>
var c = document.getElementById("artboard");
var ctx = c.getContext("2d");
ctx.fillStyle = "#4CAF50";
ctx.fillRect(20, 20, 100, 80);
ctx.fillStyle = "#2196F3";
ctx.beginPath();
ctx.arc(250, 80, 50, 0, 2 * Math.PI);
ctx.fill();
</script>
<br><br>
<h2>SVG Graphic</h2>
<svg width="300" height="150">
    <rect x="10" y="10" width="80" height="80" fill="orange" stroke="black" stroke-width="2"/>
    <circle cx="200" cy="60" r="40" fill="purple" stroke="black" stroke-width="2"/>
    <line x1="10" y1="120" x2="250" y2="120" stroke="red" stroke-width="3"/>
</svg>
</center>
</body>
</html>
