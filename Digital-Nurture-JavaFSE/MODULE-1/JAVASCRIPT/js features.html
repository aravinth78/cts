<!DOCTYPE html>
<html lang="en">
<head>
    <title>jQuery Example</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<button id="joinBtn">
    Join
</button>
<div id="panel">
    Event Panel
</div>
<script>
    $("#joinBtn").click(function(){
        $("#panel").fadeOut();
    });
</script>
</body>
</html>
