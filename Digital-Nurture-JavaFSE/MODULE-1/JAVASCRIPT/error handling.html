<!DOCTYPE html>
<html>

</head>
<body>

<script>

    {title:"Yoga Session", slots:0}
];
let output = "";
sessions.forEach(function(session){

        output += session.title + "<br>";
    }
});
try{
    let info = undefined;
    info.title;
}
catch(err){
    output += "<br>Caught Error";
}
document.getElementById("display").innerHTML = output;
</script>
</body>
</html>
