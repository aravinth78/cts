<!DOCTYPE html>
<html lang="en">
<head>
    <title>Fetch API</title>
</head>
<body>
<button onclick="postInfo()">
    Submit Info
</button>
<p id="status"></p>
<script>
    function postInfo(){
        document.getElementById("status")
        .innerHTML = "Processing...";
        setTimeout(function(){
            fetch("https://jsonplaceholder.typicode.com/posts",{
                method:"POST",
                body: JSON.stringify({
                    name:"Priya"
                }),
                headers:{
                    "Content-type":"application/json"
                }
            })
            .then(response => response.json())
            .then(info => {
                document.getElementById("status")
                .innerHTML = "Info Submitted";
                console.log(info);
            });
        },2000);
    }
</script>
</body>
</html>
