<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="display-3 fw-bold">Typography Demo</h1>
        <p class="lead text-info">Lead paragraph example with a blue tint.</p>
        <p class="text-uppercase fw-light">uppercase light text</p>
        <p class="text-lowercase fst-italic">LOWERCASE ITALIC</p>
        <p class="text-danger-emphasis">Emphasis with danger color.</p>
        <p class="text-success bg-dark p-2 rounded">Success on dark background.</p>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
