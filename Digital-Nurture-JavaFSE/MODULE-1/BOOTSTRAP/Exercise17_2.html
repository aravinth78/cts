<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icons in UI</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Icons in Action</h2>
        <ul class="nav nav-tabs mb-4">
            <li class="nav-item"><a class="nav-link active" href="#"><i class="bi bi-house-fill"></i> Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-envelope-fill"></i> Inbox</a></li>
            <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-gear-fill"></i> Settings</a></li>
        </ul>
        <button class="btn btn-primary me-2"><i class="bi bi-upload"></i> Upload</button>
        <button class="btn btn-warning me-2"><i class="bi bi-pencil-square"></i> Edit</button>
        <button class="btn btn-danger"><i class="bi bi-trash3"></i> Remove</button>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
