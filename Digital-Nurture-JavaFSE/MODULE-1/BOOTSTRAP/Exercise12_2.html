<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Tiers</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container py-5">
        <h2 class="text-center mb-5">Choose Your Plan</h2>
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card text-center p-4 border-primary">
                    <h3>Starter</h3>
                    <h4 class="text-primary my-3">$9/mo</h4>
                    <p>1 project</p>
                    <p>5 GB storage</p>
                    <button class="btn btn-outline-primary mt-2">Get Started</button>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card text-center p-4 border-success shadow">
                    <h3>Professional</h3>
                    <h4 class="text-success my-3">$29/mo</h4>
                    <p>Unlimited projects</p>
                    <p>50 GB storage</p>
                    <button class="btn btn-success mt-2">Subscribe</button>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card text-center p-4 border-warning">
                    <h3>Enterprise</h3>
                    <h4 class="text-warning my-3">$99/mo</h4>
                    <p>Everything included</p>
                    <p>500 GB storage</p>
                    <button class="btn btn-warning mt-2">Contact Sales</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
