<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Component</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">User Profile Card</h2>
        <div class="card mx-auto shadow" style="width: 20rem;">
            <img src="https://via.placeholder.com/300x180/6c757d/ffffff?text=Avatar" class="card-img-top" alt="User">
            <div class="card-body text-center">
                <h5 class="card-title">Alex Rivera</h5>
                <p class="card-text text-muted">Full-stack developer passionate about modern web technologies.</p>
                <a href="#" class="btn btn-success">Connect</a>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
