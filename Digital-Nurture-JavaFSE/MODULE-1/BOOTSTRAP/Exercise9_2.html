<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Groups</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Grouped Buttons</h2>
        <div class="btn-group mb-4" role="group">
            <button class="btn btn-outline-info">Prev</button>
            <button class="btn btn-info">1</button>
            <button class="btn btn-outline-info">2</button>
            <button class="btn btn-outline-info">3</button>
            <button class="btn btn-outline-info">Next</button>
        </div>
        <h4>Toggle Checkboxes</h4>
        <input type="checkbox" class="btn-check" id="toggleA" autocomplete="off">
        <label class="btn btn-outline-warning" for="toggleA">Toggle A</label>
        <input type="checkbox" class="btn-check" id="toggleB" autocomplete="off">
        <label class="btn btn-outline-warning" for="toggleB">Toggle B</label>
        <input type="checkbox" class="btn-check" id="toggleC" autocomplete="off">
        <label class="btn btn-outline-warning" for="toggleC">Toggle C</label>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
