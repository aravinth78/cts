<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Variation</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h3 class="text-center mb-3 fw-light">Three Column Layout</h3>
        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="bg-danger text-white p-3 text-center rounded-3">Panel 1</div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="bg-warning text-dark p-3 text-center rounded-3">Panel 2</div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="bg-success text-white p-3 text-center rounded-3">Panel 3</div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
