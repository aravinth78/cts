<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reorder Columns</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Column Reordering Demo</h2>
        <div class="row">
            <div class="col-md-6 order-md-2 mb-2">
                <div class="bg-info text-white p-4 text-center rounded">Right Side (First in mobile)</div>
            </div>
            <div class="col-md-6 order-md-1 mb-2">
                <div class="bg-secondary text-white p-4 text-center rounded">Left Side (Second in mobile)</div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
