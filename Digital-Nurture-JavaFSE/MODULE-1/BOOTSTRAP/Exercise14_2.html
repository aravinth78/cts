<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Sidebar</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 d-none d-md-block bg-secondary text-white p-4 vh-100">
                <h4>Side Panel</h4>
                <ul class="list-unstyled">
                    <li class="py-1">Overview</li>
                    <li class="py-1">Analytics</li>
                    <li class="py-1">Settings</li>
                    <li class="py-1">Logs</li>
                </ul>
            </div>
            <div class="col-md-9 p-4">
                <h2>Main Workspace</h2>
                <p>The left sidebar appears on medium screens and above.</p>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
