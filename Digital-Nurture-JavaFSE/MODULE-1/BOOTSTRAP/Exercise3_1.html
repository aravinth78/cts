<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout Demo</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h2 class="text-center mb-4 text-uppercase">Responsive Grid System</h2>
        <div class="row g-3">
            <div class="col-12 col-sm-6 col-xl-4">
                <div class="bg-info text-white p-4 rounded text-center">Block A</div>
            </div>
            <div class="col-12 col-sm-6 col-xl-4">
                <div class="bg-secondary text-white p-4 rounded text-center">Block B</div>
            </div>
            <div class="col-12 col-sm-6 col-xl-4">
                <div class="bg-dark text-white p-4 rounded text-center">Block C</div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
