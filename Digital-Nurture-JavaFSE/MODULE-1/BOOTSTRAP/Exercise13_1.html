<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Key Metrics</h2>
        <div class="row g-3">
            <div class="col-6 col-lg-3">
                <div class="bg-info text-white p-4 text-center rounded-3 shadow">
                    <h3>1,240</h3>
                    <p class="mb-0">Active Users</p>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="bg-success text-white p-4 text-center rounded-3 shadow">
                    <h3>$8,450</h3>
                    <p class="mb-0">Revenue</p>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="bg-warning text-dark p-4 text-center rounded-3 shadow">
                    <h3>38</h3>
                    <p class="mb-0">Open Tickets</p>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="bg-danger text-white p-4 text-center rounded-3 shadow">
                    <h3>12</h3>
                    <p class="mb-0">Notifications</p>
                </div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
