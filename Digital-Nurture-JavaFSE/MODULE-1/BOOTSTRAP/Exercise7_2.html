<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Utilities</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h3 class="mb-3">Text Transformation Examples</h3>
        <p class="text-capitalize fs-4">this line shows capitalized words.</p>
        <p class="text-lowercase fs-5">MAKE THIS LOWERCASE PLEASE.</p>
        <p class="text-uppercase fw-bolder fs-6">make this uppercase bold.</p>
        <p class="text-muted small">Muted small text for footnotes.</p>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
