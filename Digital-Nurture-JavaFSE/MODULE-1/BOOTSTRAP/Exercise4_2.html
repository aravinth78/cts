<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four Columns</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4 text-decoration-underline">Four Equal Blocks</h2>
        <div class="row g-2">
            <div class="col-6 col-md-3">
                <div class="bg-primary text-white p-4 text-center rounded">Tile 1</div>
            </div>
            <div class="col-6 col-md-3">
                <div class="bg-info text-white p-4 text-center rounded">Tile 2</div>
            </div>
            <div class="col-6 col-md-3">
                <div class="bg-warning text-dark p-4 text-center rounded">Tile 3</div>
            </div>
            <div class="col-6 col-md-3">
                <div class="bg-danger text-white p-4 text-center rounded">Tile 4</div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
