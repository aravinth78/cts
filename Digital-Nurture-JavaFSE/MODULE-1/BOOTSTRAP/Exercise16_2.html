<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge Overlay</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5 text-center">
        <h2 class="mb-4">Image with Badge</h2>
        <div class="position-relative d-inline-block">
            <img src="https://via.placeholder.com/350x200/343a40/ffffff?text=Photo" class="img-fluid rounded" alt="Sample">
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark fs-6">Sale</span>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
