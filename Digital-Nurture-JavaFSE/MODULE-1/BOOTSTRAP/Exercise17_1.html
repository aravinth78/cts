<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Usage</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container mt-5 text-center">
        <h2>Social Media Icons</h2>
    </div>
    <footer class="bg-secondary text-white text-center p-4 mt-5">
        <h4>Connect With Us</h4>
        <i class="bi bi-twitter-x fs-1 mx-3"></i>
        <i class="bi bi-youtube fs-1 mx-3"></i>
        <i class="bi bi-github fs-1 mx-3"></i>
        <i class="bi bi-linkedin fs-1 mx-3"></i>
    </footer>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
